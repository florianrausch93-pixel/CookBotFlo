<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cook Bot 2000</title>
<link rel="stylesheet" href="fonts.css">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Flo's cookbook: recipes to browse, scale and cook.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b1b11">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cook Bot">
<style>
/* Layout: a recipe binder. Coloured chapter tabs, sticker-like cards with a hard offset shadow that "press" when tapped, a floating dock for the four main jobs. */
/* Colour: the page ground is a dark, moody scene that follows the season (autumn by default, so the first frame is right).
   Cards stay cream "stickers" on top of it; --ink is text on cards, --on-bg is text straight on the scene. */
:root{
  --bg1:#1d100b; --bg2:#3b1b11; --glow1:rgba(255,138,61,.38); --glow2:rgba(200,66,79,.32); --glow3:rgba(246,183,60,.18);
  --on-bg:#fbe9d7; --on-bg-muted:#dcb79a;
  --card:#fff6ea; --paper:var(--card); --soft:#f7e6d2;
  --ink:#2b1a12; --muted-card:#85624c; --edge:#2b1a12;
  --hard:#e0742f;          /* sticker shadow: a seasonal colour, so it reads on the dark ground */
  --butter:#f6b73c;        /* primary action */
  --tomato:#e05a6b;        /* accent */
  --wild:linear-gradient(125deg,#f6b73c 0%,#f39a5b 48%,#e8838f 100%);
  --ok:#5fb36a; --danger:#e0534a; --on-cat:#2b1a12;
  --c-breakfast:#f6c65b; --c-soups:#f39a5b; --c-pasta:#f2d48a; --c-meat:#e8838f; --c-fish:#9fc3b8;
  --c-veggie:#b7c97a; --c-salads:#d6d98c; --c-bread:#d9a87a; --c-cakes:#f0a7a0; --c-desserts:#e6a0b8; --c-protein:#a8cf9e;
  --m-protein:#5fb36a; --m-carbs:#ffd75e; --m-fat:#ff9f7a;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
  --r:18px; --r-sm:12px;
  --sh:3px 3px 0 var(--hard);
  --sh-lg:5px 5px 0 var(--hard);
  color-scheme:light;
}
:root[data-season="winter"]{
  --bg1:#0a1324; --bg2:#1b2f50; --glow1:rgba(130,190,255,.30); --glow2:rgba(214,72,110,.22); --glow3:rgba(255,255,255,.10);
  --on-bg:#eef5ff; --on-bg-muted:#a9bfdc;
  --card:#f5f8fc; --soft:#e4ecf6; --ink:#13203a; --muted-card:#5b6c88; --edge:#13203a;
  --hard:#6f9fe0; --butter:#ffd166; --tomato:#e0485d;
  --wild:linear-gradient(125deg,#a9d4f5 0%,#d7c4f0 50%,#f5c0d2 100%); --on-cat:#13203a;
  --c-breakfast:#ffe29a; --c-soups:#f5b48c; --c-pasta:#f7e3b0; --c-meat:#f0a0aa; --c-fish:#a9d4f5;
  --c-veggie:#b4dcc0; --c-salads:#cfe8d8; --c-bread:#e2c4a2; --c-cakes:#f5c0d2; --c-desserts:#d7c4f0; --c-protein:#9fdcd0;
}
:root[data-season="spring"]{
  --bg1:#0e2118; --bg2:#21452f; --glow1:rgba(255,140,190,.30); --glow2:rgba(150,230,120,.24); --glow3:rgba(255,227,110,.14);
  --on-bg:#f0fbe9; --on-bg-muted:#b8d6b1;
  --card:#fbfff6; --soft:#eaf6dd; --ink:#17301f; --muted-card:#5a7560; --edge:#17301f;
  --hard:#ef7fae; --butter:#ffe36e; --tomato:#ff6f9f;
  --wild:linear-gradient(125deg,#ffc3dd 0%,#ffe88a 50%,#b8eb9a 100%); --on-cat:#17301f;
  --c-breakfast:#ffe88a; --c-soups:#ffc6a0; --c-pasta:#fff1a8; --c-meat:#ffb2c1; --c-fish:#b7e4f0;
  --c-veggie:#b8eb9a; --c-salads:#d8f5a8; --c-bread:#ecd0a6; --c-cakes:#ffc3dd; --c-desserts:#f4b9e6; --c-protein:#a6e8c8;
}
:root[data-season="summer"]{
  --bg1:#06252b; --bg2:#0e4d55; --glow1:rgba(255,190,80,.30); --glow2:rgba(255,107,122,.26); --glow3:rgba(120,240,220,.14);
  --on-bg:#e9fbfb; --on-bg-muted:#a5d6d4;
  --card:#fffaf0; --soft:#fbefd8; --ink:#12313a; --muted-card:#567077; --edge:#12313a;
  --hard:#ff8a5c; --butter:#ffc94a; --tomato:#ff6b7a;
  --wild:linear-gradient(125deg,#ffd56b 0%,#ffab76 50%,#ff9fd0 100%); --on-cat:#12313a;
  --c-breakfast:#ffd56b; --c-soups:#ffab76; --c-pasta:#ffe58a; --c-meat:#ff9a9a; --c-fish:#7fd6e8;
  --c-veggie:#b5ec7a; --c-salads:#d2f58a; --c-bread:#f0c48e; --c-cakes:#ffb3c8; --c-desserts:#ff9fd0; --c-protein:#8ee6c2;
}

*{box-sizing:border-box}
body{background:var(--bg1);color:var(--on-bg);--muted:var(--on-bg-muted);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(60% 45% at 85% 8%,var(--glow1),transparent 70%),
  radial-gradient(55% 50% at 5% 90%,var(--glow2),transparent 70%),
  radial-gradient(40% 35% at 30% 30%,var(--glow3),transparent 70%),
  linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%);transition:background .6s}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.35) 100%)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%}
/* card surfaces: dark ink text, muted shades meant for cream */
.rcard,.panel,.chip,.btn,.searchbox,.empty,.callout,.idea,.bubble,.pill,.input,.tabs,.drop,.confirm,.toast,.iconbtn,.flagtag,.wild,.chapter,.band,.stepper,.heart,.brand-badge,.dock-in,.prot,.notecard{color:var(--ink);--muted:var(--muted-card)}
.top,.wrap,.dock{position:relative;z-index:1}
.top{position:sticky}.dock{position:fixed}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg1) 72%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(10px)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{color:var(--on-bg);display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.15rem;background:none;border:0;padding:4px;letter-spacing:-.02em}
.brand-badge{width:38px;height:38px;border-radius:12px;background:var(--card);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--hard);display:grid;place-items:center;color:var(--on-cat);transform:rotate(-6deg);transition:transform .25s}
.brand:hover .brand-badge{transform:rotate(8deg) scale(1.06)}
.brand small{font-family:var(--body);font-weight:800;font-size:.7rem;background:var(--butter);color:var(--ink);border-radius:6px;padding:1px 5px;margin-left:2px}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:13px;border:2px solid var(--edge);background:var(--card);display:grid;place-items:center;box-shadow:2px 2px 0 var(--hard);transition:transform .12s,box-shadow .12s}
.iconbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--hard)}
.iconbtn[hidden]{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--edge);border-radius:14px;padding:10px 16px;font-weight:800;background:var(--card);box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,background .2s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hard)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--hard)}
.btn.primary{background:var(--butter);color:var(--on-cat)}
.btn.dark{background:var(--tomato);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{box-shadow:none;background:transparent;color:inherit;border-color:color-mix(in srgb,currentColor 45%,transparent)}
.btn.ghost:hover{background:color-mix(in srgb,currentColor 12%,transparent);transform:none}
.btn.sm{padding:6px 11px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.55;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:999px;padding:5px 12px;background:var(--card);font-weight:700;font-size:.9rem;transition:transform .12s,background .15s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--butter);color:var(--ink);border-color:var(--edge);box-shadow:2px 2px 0 var(--hard)}
.chip.cat{color:var(--on-cat);border-color:var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.09em;font-size:.74rem;color:var(--muted)}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:1.55rem}
.muted{color:var(--muted)}

/* hero */
.hero{padding-top:18px;display:grid;gap:16px}
.hero h1{text-shadow:0 2px 18px rgba(0,0,0,.35);font-size:clamp(2rem,6.5vw,3.6rem);font-weight:800;max-width:15ch}
.hero .hero-top h1{max-width:14ch}
.hero h1 em{font-style:normal;color:var(--butter)}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:6px 6px 6px 16px;box-shadow:var(--sh-lg);max-width:680px}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;font-weight:600;padding:10px 0;outline:none}
.searchbox input::placeholder{color:var(--muted);font-weight:600}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero-top h1{flex:1;min-width:0}
.buddy{position:relative;flex:none;display:grid;justify-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer}
.buddy .mascot{width:clamp(96px,22vw,170px);height:auto;filter:drop-shadow(0 8px 22px var(--glow1))}
.bubble{position:relative;background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:8px 12px;font-weight:800;font-size:.86rem;max-width:210px;box-shadow:var(--sh);text-align:center;line-height:1.3}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--card);border-right:2px solid var(--edge);border-bottom:2px solid var(--edge);transform:translateX(-50%) rotate(45deg)}
@media (max-width:560px){.hero-top{flex-direction:column-reverse;align-items:flex-start}.buddy{flex-direction:row;display:flex;align-items:center;gap:10px}.buddy .mascot{width:84px}.bubble::after{left:-9px;top:50%;bottom:auto;transform:translateY(-50%) rotate(135deg)}.bubble{order:2;text-align:left}}
.mascot .m-bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.mascot .m-eyes{animation:blink 4.2s infinite;transform-origin:50% 50%;transform-box:fill-box}
.mascot.busy .m-bob{animation:bob .6s ease-in-out infinite}
.mascot.jump .m-bob{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(4px) scale(1.1,.88)}55%{transform:translateY(-22px) rotate(10deg) scale(.95,1.06)}100%{transform:translateY(0)}}
.brand-badge .mascot{width:30px;height:30px}
.flagtag{position:absolute;left:10px;top:10px;z-index:1;display:inline-flex;gap:5px;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.78rem}
.world{display:flex;flex-wrap:wrap;gap:10px}
.world .chip{font-size:.95rem;padding:7px 14px;box-shadow:2px 2px 0 var(--hard)}
.world .chip b{font-variant-numeric:tabular-nums;opacity:.6;margin-left:2px}
.band.world-band{background:linear-gradient(120deg,var(--c-fish),var(--c-salads))}
.band .bigflag{position:absolute;right:14px;top:6px;font-size:96px;line-height:1;transform:rotate(10deg);opacity:.9}
@media (max-width:560px){.band .bigflag{font-size:64px;opacity:.45;top:auto;bottom:8px}}
.season-band.autumn{background:linear-gradient(120deg,#f6b73c,#f39a5b 55%,#e8838f)}
.season-band.winter{background:linear-gradient(120deg,#a9d4f5,#eef5ff 60%,#d7c4f0)}
.season-band.spring{background:linear-gradient(120deg,#b8eb9a,#ffe88a 55%,#ffc3dd)}
.season-band.summer{background:linear-gradient(120deg,#ffd56b,#ffab76 55%,#ff9fd0)}
/* nutrition */
.nutri{margin-top:20px}
.nutri-grid{display:grid;gap:18px}
@media (min-width:760px){.nutri-grid{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}}
.prot{border:2px solid var(--edge);border-radius:16px;background:var(--c-protein);color:var(--on-cat);padding:16px;display:grid;align-content:start;gap:2px;box-shadow:var(--sh)}
.prot .big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.prot .big small{font-size:1.3rem}
.prot .lbl{font-weight:800}
.prot .sub{font-weight:700;opacity:.75;font-size:.88rem}
.macros{display:grid;gap:12px;min-width:0}
.split{display:flex;height:22px;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--soft)}
.split span{height:100%}
.split span+span{border-left:2px solid var(--edge)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:700;font-size:.88rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--edge);margin-right:6px;vertical-align:-1px}
.mrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.nsbox{margin-top:18px;padding-top:16px;border-top:2px dashed color-mix(in srgb,var(--edge) 25%,transparent);display:grid;gap:12px;align-items:center}
@media (min-width:640px){.nsbox{grid-template-columns:auto 1fr;gap:20px}}
.ns{display:flex;align-items:center;margin-top:6px;background:#fff;border:2px solid var(--edge);border-radius:14px;padding:4px;width:max-content;box-shadow:var(--sh)}
.ns span{width:34px;height:38px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;opacity:.38;font-size:1.05rem}
.ns span:first-child{border-radius:9px 0 0 9px}.ns span:last-child{border-radius:0 9px 9px 0}
.ns span.on{opacity:1;width:48px;height:52px;margin:-8px 2px;border-radius:12px;border:2px solid var(--edge);font-size:1.6rem;box-shadow:2px 2px 0 var(--edge)}
.nswhy{font-size:.93rem;font-weight:600}
.nspill{padding:2px 4px}
.nspill i{font-style:normal;color:#fff;font-family:var(--display);border-radius:999px;width:20px;height:20px;display:grid;place-items:center;font-size:.8rem}
.mrow{background:var(--soft);border-radius:14px;padding:10px 12px}
.mrow .v{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.mrow .k{font-weight:700;font-size:.85rem;color:var(--muted)}
.wild{position:relative;border:2px solid var(--edge);border-radius:24px;padding:18px;background:var(--wild);box-shadow:var(--sh-lg)}
.wild .sec-head{margin-bottom:12px}
.wild .sec-head h2{display:flex;align-items:center;gap:8px}
.wild .note{font-size:.85rem;font-weight:700;color:var(--ink);opacity:.7}
.wild .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.wild .why{font-size:1.2rem}
.trend{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--card);border-radius:999px;padding:2px 9px;width:max-content}
.confetti{position:fixed;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:60;border:1.5px solid var(--hard)}

/* chapters */
.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chapter.auto{background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.35) 10px 20px)}
@media (min-width:640px){.chapters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.chapters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chapter{position:relative;text-align:left;border:2px solid var(--edge);border-radius:var(--r);padding:14px 14px 16px;min-height:150px;color:var(--on-cat);box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .18s cubic-bezier(.3,1.6,.6,1),box-shadow .12s}
.chapter::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--on-cat) 14%,transparent) 1.4px,transparent 1.6px);background-size:14px 14px;opacity:.7}
.chapter>*{position:relative}
.chapter:hover{transform:translateY(-4px) rotate(-1.2deg)}
.chapter:nth-child(even):hover{transform:translateY(-4px) rotate(1.2deg)}
.chapter:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--hard)}
.chapter .ch-ic{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,#fff 55%,transparent);border:2px solid var(--on-cat);display:grid;place-items:center}
.chapter .ch-ic .ic{width:28px;height:28px;stroke-width:1.9}
.chapter h3{font-size:1.12rem;font-weight:800;margin-top:14px}
.chapter .count{font-weight:800;font-size:.82rem;opacity:.8}

/* recipe cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.rcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:2px solid var(--edge);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:transform .18s cubic-bezier(.3,1.6,.6,1),box-shadow .12s;padding:0;cursor:pointer}
.rcard:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
.rcard:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--hard)}
.cover{position:relative;height:128px;border-bottom:2px solid var(--edge);color:var(--on-cat);overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--on-cat) 16%,transparent) 1.5px,transparent 1.7px);background-size:16px 16px}
.cover .big{position:absolute;right:-14px;bottom:-22px;width:130px;height:130px;stroke-width:1.4;transform:rotate(-14deg);opacity:.9;transition:transform .4s cubic-bezier(.3,1.6,.6,1)}
.rcard:hover .cover .big{transform:rotate(4deg) scale(1.06)}
.cover .badge{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:999px;padding:2px 9px;font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums}
.rbody{padding:14px 16px 16px;display:grid;gap:6px}
.rbody h3{font-size:1.18rem;font-weight:800}
.rbody p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heart{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:2px solid var(--edge);background:var(--card);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.8,.6,1)}
.heart:hover{transform:scale(1.12)}
.heart.on{background:var(--tomato);color:#fff}
.heart.on .ic{fill:currentColor}
.heart.pop{animation:pop .45s cubic-bezier(.3,1.8,.6,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.match{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.match span{font-size:.78rem;font-weight:800;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ink);border-radius:999px;padding:1px 8px}

.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,280px);gap:16px;overflow-x:auto;padding:4px 6px 12px 2px;scroll-snap-type:x mandatory}
.scroller>*{scroll-snap-align:start}

/* chapter header */
.band{position:relative;border:2px solid var(--edge);border-radius:24px;padding:22px 20px;color:var(--on-cat);box-shadow:var(--sh-lg);overflow:hidden;margin-top:12px}
.band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--on-cat) 14%,transparent) 1.5px,transparent 1.7px);background-size:16px 16px}
.band>*{position:relative}
.band .big{position:absolute;right:-10px;top:-16px;width:170px;height:170px;stroke-width:1.3;transform:rotate(12deg);opacity:.85}
.band h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;max-width:14ch}
.band p{margin:6px 0 0;font-weight:700;max-width:46ch;opacity:.85}
.band .chips{margin-top:14px}
.band .chip{background:color-mix(in srgb,#fff 70%,transparent);color:var(--on-cat);border-color:var(--on-cat)}
.band .chip.on{background:var(--on-cat);color:#fff}

/* recipe page */
.rhead{margin-top:12px}
.rhead .band{padding:22px 20px 24px}
.rhead h1{max-width:20ch}
.rhead .band .big{opacity:.28;width:190px;height:190px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta .pill{background:color-mix(in srgb,#fff 80%,transparent);color:var(--on-cat);border-color:var(--on-cat)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.rlayout{display:grid;gap:20px;margin-top:22px}
@media (min-width:880px){.rlayout{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}
.panel h2{font-size:1.35rem;margin-bottom:12px}
.scaler{display:grid;gap:10px;background:var(--soft);border-radius:14px;padding:12px;margin-bottom:14px}
.scaler-row{display:flex;align-items:center;gap:10px}
.scaler-row .lbl{font-weight:800;flex:1}
.stepper{display:flex;align-items:center;border:2px solid var(--edge);border-radius:14px;background:var(--card);overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.stepper button:active{background:var(--butter);color:var(--on-cat)}
.stepper output{min-width:46px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.45rem;font-variant-numeric:tabular-nums}
.bump{animation:bump .35s cubic-bezier(.3,1.8,.6,1)}
@keyframes bump{0%{transform:scale(.7)}100%{transform:scale(1)}}
.scaled-note{font-size:.85rem;font-weight:700;color:var(--muted)}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li.head{font-family:var(--display);font-weight:800;margin-top:12px;padding:0 4px;font-size:1rem}
.ing{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:8px 6px;border-radius:10px;transition:background .15s}
.ing:hover{background:var(--soft)}
.ing .box{width:20px;height:20px;border:2px solid var(--edge);border-radius:7px;flex:none;align-self:center;display:grid;place-items:center;transition:background .15s}
.ing .q{font-weight:800;min-width:72px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .n{flex:1;min-width:0}
.ing .note{color:var(--muted);font-size:.9em}
.ing.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ing.done .q,.ing.done .n{text-decoration:line-through;opacity:.5}
.ing.flash .q{animation:flash .5s}
@keyframes flash{0%{color:var(--tomato)}100%{color:inherit}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:flex;gap:14px;text-align:left;width:100%;border:2px solid transparent;background:var(--soft);border-radius:14px;padding:14px;transition:background .2s,border-color .2s,transform .15s}
.step:hover{transform:translateX(3px)}
.step .num{width:34px;height:34px;flex:none;border-radius:11px;border:2px solid var(--edge);background:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.step .txt{flex:1;min-width:0}
.step.current{border-color:var(--edge);background:var(--card);box-shadow:var(--sh)}
.step.current .num{background:var(--butter);color:var(--on-cat)}
.step.done{opacity:.5}
.step.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.notecard{margin-top:20px;background:var(--butter);color:var(--on-cat);border:2px solid var(--edge);border-radius:6px;padding:16px 18px;box-shadow:var(--sh);transform:rotate(-.8deg);background-image:repeating-linear-gradient(transparent 0 30px,color-mix(in srgb,var(--on-cat) 14%,transparent) 30px 31px)}
.notecard .eyebrow{color:var(--on-cat);opacity:.7}
.notecard p{font-family:var(--hand);font-size:1.45rem;line-height:31px;margin:4px 0 0;white-space:pre-wrap}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:700;border:0;background:transparent;padding:4px}
.toggle .sw{width:42px;height:26px;border-radius:99px;border:2px solid var(--edge);background:var(--soft);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.6,1)}
.toggle.on .sw{background:var(--ok)}
.toggle.on .sw::after{transform:translateX(16px);background:#fff}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:color-mix(in srgb,var(--danger) 12%,var(--card));border:2px solid var(--danger);border-radius:14px;padding:10px 14px;font-weight:700;margin-top:12px}

/* forms */
.form{display:grid;gap:18px;margin-top:20px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:800;font-size:.95rem}
.field .hint{font-size:.85rem;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:2px solid var(--edge);border-radius:14px;background:var(--card);padding:11px 14px;font-weight:600;outline:none;transition:box-shadow .15s}
.input:focus{box-shadow:var(--sh)}
textarea.input{min-height:150px;resize:vertical;line-height:1.55}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border-radius:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.tabs button.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--edge)}
.callout{border:2px dashed var(--edge);border-radius:16px;padding:14px 16px;background:var(--card);display:flex;gap:12px;align-items:flex-start}
.callout .ic{margin-top:3px}
.callout p{margin:0}
.callout.good{border-style:solid;background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.callout.warn{border-style:solid;background:color-mix(in srgb,var(--tomato) 14%,var(--card))}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:2px solid var(--edge)}
.drop{border:2px dashed var(--edge);border-radius:18px;padding:26px 16px;text-align:center;background:var(--card);display:grid;gap:8px;justify-items:center;cursor:pointer}

.idea details summary::-webkit-details-marker{display:none}
.idea details[open] summary .ic{transform:rotate(90deg)}
.idea details ul,.idea details ol{margin:8px 0 0;padding-left:20px;font-size:.93rem}
.cooking{display:grid;justify-items:center;gap:10px;padding:34px 10px;text-align:center}
.pot{width:92px;height:92px;color:currentColor}
.cooking .mascot{width:110px}

.weblinks{display:flex;flex-wrap:wrap;gap:8px}

/* fridge picker */
.fridge{display:flex;flex-wrap:wrap;gap:8px}
.fridge .chip{font-size:.85rem;padding:4px 11px}

.empty{border:2px dashed var(--edge);border-radius:22px;padding:32px 18px;text-align:center;display:grid;gap:12px;justify-items:center;background:var(--card)}
.empty .ic{width:56px;height:56px;stroke-width:1.5}
.empty h3{font-size:1.35rem}
.empty p{margin:0;max-width:46ch;color:var(--muted)}
.skel{height:230px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.16),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.4s infinite linear;border:2px solid rgba(255,255,255,.12)}
@keyframes sk{to{background-position:-200% 0}}
.banner{margin-top:12px;font-size:.88rem;font-weight:700;display:flex;gap:8px;align-items:center;color:var(--muted)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.dock-in{pointer-events:auto;display:flex;gap:4px;background:var(--card);border:2px solid var(--edge);border-radius:22px;padding:6px;box-shadow:4px 4px 0 var(--hard),0 14px 34px rgba(0,0,0,.45);max-width:100%}
.dock button{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px;border-radius:16px;font-weight:800;font-size:.72rem;min-width:66px;transition:background .15s,color .15s,transform .2s cubic-bezier(.3,1.8,.6,1)}
.dock button .ic{width:22px;height:22px}
.dock button:hover{transform:translateY(-2px)}
.dock button.on{background:var(--butter);color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge)}
@media (max-width:380px){.dock button{min-width:56px;padding:7px 8px}}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--card);border:2px solid var(--edge);box-shadow:var(--sh);border-radius:14px;padding:10px 16px;font-weight:800;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.6,1);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.view-in{animation:viewin .35s cubic-bezier(.2,.9,.3,1)}
@keyframes viewin{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.looks{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.looks .lbl{font-weight:800}
.looks .chip{gap:8px}
.looks .sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* quantities */
const FR = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
const NICE = [[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
const METRIC = new Set(['g','ml','kg','l','mg','cl','dl']);
function fmtQty(q, unit){
  if (q == null || q === '' || isNaN(q)) return {q:'', unit:unit||''};
  let u = (unit||'').trim(); const lu = u.toLowerCase();
  if (lu==='g' && q>=1000){ q=q/1000; u='kg'; } else if (lu==='ml' && q>=1000){ q=q/1000; u='l'; }
  const L = u.toLowerCase();
  if (L==='g'||L==='ml'){
    const r = q>=100 ? Math.round(q/5)*5 : q>=10 ? Math.round(q) : Math.round(q*2)/2;
    return {q:String(r), unit:u};
  }
  if (METRIC.has(L)) return {q:String(+q.toFixed(2)).replace(/\.?0+$/,'') || '0', unit:u};
  if (q>=10) return {q:String(Math.round(q)), unit:u};
  const whole = Math.floor(q), frac = q-whole;
  let best = NICE[0]; for (const n of NICE) if (Math.abs(n[0]-frac) < Math.abs(best[0]-frac)) best = n;
  let w = whole + (best[0]===1 ? 1 : 0); const f = best[0]===1 ? '' : best[1];
  const s = (w ? String(w) : '') + f;
  return {q: s || '¼', unit:u};
}
const UNITS = ['g','kg','mg','ml','l','dl','cl','tsp','tbsp','tl','el','cup','cups','oz','lb','lbs','pinch','pinches','clove','cloves','can','cans','tin','tins','jar','jars','slice','slices','piece','pieces','pc','pcs','bunch','bunches','handful','handfuls','sprig','sprigs','stick','sticks','packet','packets','pack','pkg','sheet','sheets','stalk','stalks','head','heads','dash','drop','drops','prise','bund','dose','becher','pck','stk'];
function parseNum(s){
  s = s.trim().replace(',', '.');
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if ((m = s.match(/^(\d*)\s*([½¼¾⅓⅔⅛])$/))) return (+m[1]||0) + FR[m[2]];
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function parseLine(line){
  let t = line.trim().replace(/^[-•*·]\s*/, '');
  if (!t) return null;
  if (/:$/.test(t)) return {heading: t.slice(0,-1).trim()};
  const m = t.match(/^((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d*\s*[½¼¾⅓⅔⅛])|(?:\d+(?:[.,]\d+)?))(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?\s*/);
  let qty = null, unit = '', rest = t;
  if (m){ qty = parseNum(m[1]); rest = t.slice(m[0].length); }
  const um = rest.match(/^([A-Za-zäöüÄÖÜ]+)\.?(?=\s|$)/);
  if (qty != null && um && UNITS.includes(um[1].toLowerCase())){ unit = um[1]; rest = rest.slice(um[0].length).trim(); }
  let note = '';
  const pm = rest.match(/\(([^)]*)\)\s*$/); if (pm){ note = pm[1]; rest = rest.slice(0, pm.index).trim(); }
  const ci = rest.indexOf(','); if (ci > 0){ note = [rest.slice(ci+1).trim(), note].filter(Boolean).join(', '); rest = rest.slice(0,ci).trim(); }
  return {qty, unit, name: rest || t, note};
}
function lineOf(i){
  if (i.heading) return i.heading + ':';
  const raw = i.qty==null ? '' : String(+(+i.qty).toFixed(3));
  return [raw, i.unit, i.name].filter(Boolean).join(' ') + (i.note ? ', ' + i.note : '');
}

function guessCats(r){
  const t = (r.title+' '+(r.tags||[]).join(' ')+' '+(r.ingredients||[]).map(i=>i.name).join(' ')).toLowerCase();
  const c = [];
  if (/sourdough|sauerteig|bread|loaf|focaccia|brötchen|roll|baguette|brot/.test(t)) c.push('bread');
  else if (/cake|cookie|muffin|brownie|scone|kuchen|bun|tart|pie/.test(t)) c.push('cakes');
  else if (/dessert|pudding|mousse|ice cream|tiramisu|panna|brûlée|brulee/.test(t)) c.push('desserts');
  if (/soup|stew|broth|chili|chowder|suppe|eintopf/.test(t)) c.push('soups');
  if (/pasta|spaghetti|noodle|lasagne|penne|spätzle|ramen|gnocchi/.test(t)) c.push('pasta');
  if (/salmon|tuna|cod|prawn|shrimp|fish|lachs|seafood/.test(t)) c.push('fish');
  if (/beef|pork|chicken|lamb|turkey|minced|mince|bacon|sausage|steak|hack|rind|huhn/.test(t)) c.push('meat');
  if (/salad|bowl/.test(t)) c.push('salads');
  if (/pancake|porridge|oats|granola|omelette|breakfast/.test(t)) c.push('breakfast');
  if (!c.length) c.push('veggie');
  return c;
}

    description: String(r.description||'').trim().slice(0,400),
    categories: [...new Set((Array.isArray(r.categories)?r.categories:[r.categories]).map(x=>String(x||'').toLowerCase().trim()).map(x=>({vegetarian:'veggie',vegan:'veggie',seafood:'fish',noodles:'pasta',sourdough:'bread',pastries:'cakes'})[x]||x).filter(x=>CAT[x]))],
    servings: Math.max(1, Math.round(num(r.servings)||4)),
    time: num(r.time) ? Math.round(num(r.time)) : null,
    difficulty: ['easy','medium','hard'].includes(String(r.difficulty).toLowerCase()) ? String(r.difficulty).toLowerCase() : 'easy',
    tags: (Array.isArray(r.tags)?r.tags:[]).map(t=>String(t).toLowerCase().trim()).filter(Boolean).slice(0,10),
    ingredients: (Array.isArray(r.ingredients)?r.ingredients:[]).map(i => i && i.heading ? {heading:String(i.heading)} : i && i.name ? {qty:num(i.qty), unit:String(i.unit||'').trim(), name:String(i.name).trim(), note:String(i.note||'').trim()} : null).filter(Boolean),
    steps: (Array.isArray(r.steps)?r.steps:[]).map(s=>String(s).trim()).filter(Boolean),
    nutrition: {kcal: num(r.nutrition?.kcal), protein: num(r.nutrition?.protein), carbs: num(r.nutrition?.carbs), fat: num(r.nutrition?.fat), fiber: num(r.nutrition?.fiber), sugar: num(r.nutrition?.sugar)},
    cuisine: String(r.cuisine||'').trim().slice(0,40).replace(/\b\w/g, ch => ch.toUpperCase()),
    seasons: [...new Set((Array.isArray(r.seasons)?r.seasons:[]).map(x=>String(x).toLowerCase().replace('fall','autumn')).filter(x=>SEA[x]))],
    notes: String(r.notes||'').trim(),
    source: {name: String(r.source?.name||'').trim(), url: String(r.source?.url||'').trim()},
    favorite: !!r.favorite,
    createdAt: keep.createdAt || r.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
  if (!out.categories.length) out.categories = guessCats(out);
  if (!out.seasons.length) out.seasons = out.categories.includes('soups') ? ['autumn','winter'] : SEASONS.map(x=>x.id);
  return out;
}

/* ---------- storage: the shared db, or this browser as a fallback ---------- */
const LS = 'cookbot2000.recipes';
function loadLocal(){ try { const o = JSON.parse(localStorage.getItem(LS)||'{}'); S.recipes = new Map(Object.entries(o)); } catch { S.recipes = new Map(); } }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(Object.fromEntries(S.recipes))); } catch {} }
async function put(id, r){
  if (db){ await col.doc(id).set(r); S.recipes.set(id, r); }
  else { S.recipes.set(id, r); saveLocal(); }
}
async function patch(id, fields){
  const r = {...S.recipes.get(id), ...fields};
  if (db){ S.recipes.set(id, r); await col.doc(id).update(fields); }
  else { S.recipes.set(id, r); saveLocal(); }
}
async function remove(id){
  if (db) await col.doc(id).delete();
  S.recipes.delete(id); if (!db) saveLocal();
}
function writeErr(e){
  if (e && e.code === 'invalid_argument'){ S.canWrite = false; toast('You can read this cookbook but not change it', 'out'); render(); return; }
  if (e && e.code === 'quota_exceeded'){ toast('The cookbook is full. Delete a few recipes to add more.', 'out'); return; }
  toast('That did not save. Check your connection and try again.', 'out');
}

/* ---------- routing ---------- */
const HKEY = {recipe:'r', cat:'c', season:'s', cuisine:'k', search:'search'};
const toHash = r => r.name==='home' || !HKEY[r.name] ? location.pathname + location.search : '#' + HKEY[r.name] + (r.id ? '/' + encodeURIComponent(r.id) : '');
function fromHash(){
  const [k, v] = location.hash.slice(1).split('/'); const id = v ? decodeURIComponent(v) : undefined;
  const name = Object.keys(HKEY).find(n => HKEY[n] === k);
  return name ? {name, id} : {name:'home'};
}
S.route = fromHash();
function go(route, push=true){

  if (push){ S.depth++; try { history.pushState({route, depth:S.depth}, '', toHash(route)); } catch {} }

}

});
try { history.replaceState({route:S.route, depth:0}, ''); } catch {}

/* ---------- search ---------- */
const STOP = new Set('i im i\'m ive i\'ve have has got get some a an the and with or of any my in on to want wanna something like what can could make cook do left over leftover leftovers mood for me please recipe recipes dish use using also just only fresh bit few'.split(' '));
const stem = t => t.length > 3 ? t.replace(/(tomato|potato)es$/,'$1').replace(/ies$/,'y').replace(/([^s])s$/,'$1') : t;
function terms(q){ return [...new Set(String(q).toLowerCase().replace(/[^a-z0-9äöüß\s,-]/g,' ').split(/[\s,]+/).filter(t => t.length>1 && !STOP.has(t)).map(stem))]; }
function search(q, extra=[]){
  const T = [...new Set([...terms(q), ...extra.flatMap(terms)])];
  if (!T.length) return {T, hits:[]};
  const hits = [];
  for (const [id, r] of S.recipes){
    const ings = (r.ingredients||[]).filter(i=>!i.heading).map(i => i.name.toLowerCase());
    const hay = (r.title+' '+r.description+' '+(r.tags||[]).join(' ')+' '+(r.categories||[]).map(c=>CAT[c]?.name).join(' ')+' '+(r.cuisine||'')+' '+(r.seasons||[]).join(' ')).toLowerCase();
    let score = 0; const used = [];
    for (const t of T){
      const ing = ings.find(n => n.split(/[\s-]+/).map(stem).some(w => w.startsWith(t)) || n.includes(t));
      if (ing){ score += 3; used.push(ing); } else if (hay.includes(t)) score += 1;
    }
    if (score) hits.push({id, r, score, used:[...new Set(used)], have: used.length});
  }
  hits.sort((a,b) => b.score - a.score || a.r.title.localeCompare(b.r.title));
  return {T, hits};
}
function allIngredients(){
  const count = new Map();
  for (const r of list()) for (const i of r.ingredients||[]) if (!i.heading){
    const k = i.name.toLowerCase().replace(/\b(fresh|large|small|medium|chopped|dried|ground|grated)\b/g,'').trim();
    if (k.length > 1 && k.length < 24) count.set(k, (count.get(k)||0)+1);
  }
  return [...count.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0])).map(e=>e[0]);
}

/* ---------- pieces ---------- */
const fmtTime = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
const coverIc = r => (r.categories||[]).find(c=>c!=='protein') || (r.categories||[])[0] || 'veggie';
/* Cook Score: a Nutri-Score-style A–E grade from the per-serving macros (no salt or saturated fat data, so it is our own estimate) */
const NS_COL = {A:'#038141', B:'#85bb2f', C:'#fecb02', D:'#ee8100', E:'#e63e11'};
function nutriScore(r){
  const n = r.nutrition || {}, k = +n.kcal || 0; if (!k) return null;
  const [p,f,fi,su] = ['protein','fat','fiber','sugar'].map(x => +n[x] || 0);
  const lin = (v,a,b,mx) => Math.max(0, Math.min(mx, (v-a)/(b-a)*mx));
  const cats = new Set(r.categories || []);
  const parts = {
    kcal: lin(k,350,950,10), sugar: lin(su*4/k,.05,.35,10), fat: lin(f*9/k,.30,.60,10), sweet: cats.has('cakes')||cats.has('desserts') ? 3 : 0,
    protein: lin(p*4/k,.10,.35,6), fibre: lin(fi/(k/100),.4,2.5,6), veg: cats.has('veggie')||cats.has('salads') ? 2 : 0,
  };
  const pts = parts.kcal + parts.sugar + parts.fat + parts.sweet - parts.protein - parts.fibre - parts.veg;
  const L = pts<=0 ? 'A' : pts<=4 ? 'B' : pts<=8 ? 'C' : pts<=12 ? 'D' : 'E';
  const good = [[parts.protein,'lots of protein'],[parts.fibre,'plenty of fibre'],[parts.veg*2,'veg-forward']].filter(x=>x[0]>=2).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const bad = [[parts.sugar,'a lot of sugar'],[parts.fat,'high in fat'],[parts.kcal,'very filling, lots of calories'],[parts.sweet*1.5,'a sweet treat']].filter(x=>x[0]>=2.5).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  return {L, good, bad};
}
const NS_SAY = {A:'Eat this often', B:'A great everyday choice', C:'Fine, keep it balanced', D:'More of a now-and-then dish', E:'A proper treat'};
function nsStrip(ns){
  return `<div class="ns" role="img" aria-label="Cook Score ${ns.L} on a scale from A (healthiest) to E">${'ABCDE'.split('').map(x=>`<span class="${x===ns.L?'on':''}" style="background:${NS_COL[x]}">${x}</span>`).join('')}</div>`;
}

function card(id, r, extra=''){
  const c = coverIc(r), canW = S.canWrite !== false;
  const meta = [r.time ? `<span class="pill">${ic('clock')}${fmtTime(r.time)}</span>` : '', r.nutrition?.protein ? `<span class="pill">${ic('bolt')}${Math.round(r.nutrition.protein)} g protein</span>` : '', (ns => ns ? `<span class="pill nspill" title="Cook Score ${ns.L}"><i style="background:${NS_COL[ns.L]}">${ns.L}</i></span>` : '')(nutriScore(r))].join('');
  return `<article class="rcard" data-act="open" data-id="${esc(id)}" tabindex="0" role="link" aria-label="${esc(r.title)}">
    <div class="cover" style="background:${catColor(c)}">${ic(c,'big')}${r.cuisine?`<span class="flagtag">${flag(r.cuisine)} ${esc(r.cuisine)}</span>`:''}<div class="badge">${meta}</div></div>

const skeletons = n => `<div class="grid">${'<div class="skel"></div>'.repeat(n)}</div>`;
const sortFns = { new:(a,b)=>String(b[1].createdAt).localeCompare(String(a[1].createdAt)), az:(a,b)=>a[1].title.localeCompare(b[1].title), quick:(a,b)=>(a[1].time||999)-(b[1].time||999) };
const sortChips = () => `<div class="chips" role="group" aria-label="Sort">${[['new','Newest'],['az','A to Z'],['quick','Quickest']].map(([k,l])=>`<button class="chip ${S.sort===k?'on':''}" data-act="sort" data-k="${k}">${l}</button>`).join('')}</div>`;

const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

function vRecipe(id){

  if (!r) return S.ready ? `<div class="empty" style="margin-top:20px">${ic('book')}<h3>This recipe is gone</h3><p>It may have been deleted.</p><button class="btn" data-act="home">Back to the cookbook</button></div>` : skeletons(1);
  const c = coverIc(r), base = r.servings || 4, sv = S.servings[id] || base, f = sv / base;
  const checked = S.checked[id] || (S.checked[id] = new Set());
  const at = S.stepAt[id] ?? 0, canW = S.canWrite !== false;
  const qs = [1,2,4,6,8].filter(n=>n!==base).concat(base).sort((a,b)=>a-b);
  const ings = (r.ingredients||[]).map((i,k)=>{

    const q = fmtQty(i.qty==null?null:i.qty*f, i.unit);
    return `<li><button class="ing ${checked.has(k)?'done':''}" data-act="tick" data-id="${esc(id)}" data-k="${k}" aria-pressed="${checked.has(k)}">
      <span class="box">${checked.has(k)?ic('check'):''}</span><span class="q">${esc(q.q)} ${esc(q.unit)}</span>
      <span class="n">${esc(i.name)}${i.note?` <span class="note">${esc(i.note)}</span>`:''}</span></button></li>`;

  const steps = (r.steps||[]).map((s,k)=>`<li><button class="step ${k<at?'done':k===at?'current':''}" data-act="step" data-id="${esc(id)}" data-k="${k}">

      ${(r.seasons||[]).length?`<button class="pill" data-act="seasonset" data-id="${(r.seasons.length===4?nowSeason():r.seasons.includes(nowSeason())?nowSeason():r.seasons[0])}">${seasonPills(r)}</button>`:''}

  </section>
  <div class="ractions">
    ${canW?`<button class="btn sm ${r.favorite?'primary':''}" data-act="fav" data-id="${esc(id)}">${ic('heart')}${r.favorite?'Favourite':'Add to favourites'}</button>
    <button class="btn sm" data-act="edit" data-id="${esc(id)}">${ic('edit')}Edit</button>`:''}
    <button class="btn sm primary" data-act="share" data-id="${esc(id)}">${ic('link')}Share</button>
    <button class="btn sm" data-act="copylist" data-id="${esc(id)}">${ic('copy')}Copy shopping list</button>
    <button class="toggle ${S.wake?'on':''}" data-act="wake" aria-pressed="${!!S.wake}"><span class="sw"></span>Keep screen on</button>
    ${r.source?.url?`<a class="btn sm ghost" href="${esc(r.source.url)}" target="_blank" rel="noopener">${ic('out')}${esc(r.source.name||'Original recipe')}</a>`:r.source?.name?`<span class="muted" style="font-weight:700">From ${esc(r.source.name)}</span>`:''}
    ${canW?`<button class="btn sm ghost" data-act="askdel" data-id="${esc(id)}" style="margin-left:auto">${ic('trash')}Delete</button>`:''}
  </div>
  ${S.confirmDel===id?`<div class="confirm">Delete “${esc(r.title)}” for good?<span class="spacer"></span><button class="btn sm danger" data-act="del" data-id="${esc(id)}">Delete</button><button class="btn sm" data-act="nodel">Keep it</button></div>`:''}
  </div>
  <div class="rlayout">
    <div class="stick"><section class="panel">
      <h2>Ingredients</h2>
      <div class="scaler">
        <div class="scaler-row"><span class="lbl">${ic('users')} Servings</span>
          <div class="stepper"><button data-act="sv" data-id="${esc(id)}" data-d="-1" aria-label="Fewer servings">${ic('minus')}</button><output id="svOut">${sv}</output><button data-act="sv" data-id="${esc(id)}" data-d="1" aria-label="More servings">${ic('plus')}</button></div>
        </div>
        <div class="chips">${qs.map(q=>`<button class="chip ${q===sv?'on':''}" data-act="svset" data-id="${esc(id)}" data-v="${q}">${q}${q===base?' (original)':''}</button>`).join('')}</div>
        <span class="scaled-note">${f===1?`Original recipe serves ${base}.`:`Scaled ×${+f.toFixed(2)} from ${base} servings.`}</span>
      </div>
      <ul class="ings">${ings || '<li class="muted">No ingredients yet.</li>'}</ul>
    </section></div>
    <section class="panel">
      <h2>Method</h2>
      <ol class="steps">${steps || '<li class="muted">No steps yet.</li>'}</ol>
      ${at>=(r.steps||[]).length && (r.steps||[]).length ? `<div class="callout good" style="margin-top:14px">${ic('check')}<p><b>Done. Enjoy your meal!</b> <button class="btn sm ghost" data-act="resetsteps" data-id="${esc(id)}">Start over</button></p></div>`:''}
      ${r.notes?`<div class="notecard"><span class="eyebrow">Flo's notes</span><p>${esc(r.notes)}</p></div>`:''}
      ${(r.tags||[]).length?`<div class="chips" style="margin-top:18px">${r.tags.map(t=>`<button class="chip" data-act="qsearch" data-q="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:''}
    </section>
  </div>
  ${nutriPanel(id, r, sv)}`;
}

function nutriPanel(id, r, sv){
  const n = r.nutrition || {}, canW = S.canWrite !== false;
  const has = ['protein','carbs','fat','kcal'].some(k => n[k] != null);
  if (!has) return `<section class="panel nutri"><h2>Nutrition</h2><div class="callout">${ic('bolt')}<p>No nutrition info yet. ${canW && sample ? `<button class="btn sm primary" data-act="estimate" data-id="${esc(id)}" ${S.estimating?'disabled':''}>${ic('spark')}${S.estimating?'Estimating…':'Estimate with Claude'}</button>` : canW ? 'Add it with Edit.' : ''}</p></div></section>`;
  const batch = S.nutriBatch, m = batch ? sv : 1;
  const g = v => v == null ? '–' : Math.round(v*m);
  const P = (n.protein||0)*4, C = (n.carbs||0)*4, F = (n.fat||0)*9, T = P + C + F;
  const pct = v => T ? Math.round(v/T*100) : 0;
  return `<section class="panel nutri">
    <div class="sec-head" style="margin-bottom:12px"><h2 style="margin:0">Nutrition</h2>
      <div class="chips"><button class="chip ${!batch?'on':''}" data-act="nbatch" data-v="0">Per serving</button><button class="chip ${batch?'on':''}" data-act="nbatch" data-v="1">Whole batch (${sv})</button></div></div>
    <div class="nutri-grid">
      <div class="prot"><span class="lbl">${ic('bolt')} Protein</span><span class="big">${g(n.protein)}<small> g</small></span>
        <span class="sub">${T ? pct(P) + '% of calories' : ''}${n.kcal && n.protein ? ' · ' + (n.protein/n.kcal*100).toFixed(1) + ' g per 100 kcal' : ''}</span></div>
      <div class="macros">
        ${T ? `<div class="split" role="img" aria-label="Calories from protein ${pct(P)}%, carbs ${pct(C)}%, fat ${pct(F)}%">
          <span style="width:${P/T*100}%;background:var(--m-protein)"></span><span style="width:${C/T*100}%;background:var(--m-carbs)"></span><span style="width:${F/T*100}%;background:var(--m-fat)"></span></div>
        <div class="legend"><span><i style="background:var(--m-protein)"></i>Protein ${pct(P)}%</span><span><i style="background:var(--m-carbs)"></i>Carbs ${pct(C)}%</span><span><i style="background:var(--m-fat)"></i>Fat ${pct(F)}%</span></div>` : ''}
        <div class="mrows">
          <div class="mrow"><div class="v">${g(n.kcal)}</div><div class="k">kcal</div></div>
          <div class="mrow"><div class="v">${g(n.carbs)} g</div><div class="k">Carbs</div></div>
          <div class="mrow"><div class="v">${g(n.fat)} g</div><div class="k">Fat</div></div>
          <div class="mrow"><div class="v">${g(n.fiber)} g</div><div class="k">Fibre</div></div>
          <div class="mrow"><div class="v">${g(n.sugar)} g</div><div class="k">of which sugar</div></div>
        </div>
        <span class="muted" style="font-size:.85rem">Estimated values ${batch ? 'for ' + sv + ' servings' : 'per serving'}.</span>
      </div>
    </div>
    ${(ns => ns ? `<div class="nsbox"><div><span class="eyebrow">Cook Score</span>${nsStrip(ns)}</div>
      <div class="nswhy"><b>${NS_SAY[ns.L]}.</b> ${[...ns.good.map(x=>'👍 '+x), ...ns.bad.map(x=>'👀 '+x)].join(' · ') || 'Nicely middle of the road.'}
      <span class="muted" style="display:block;font-size:.8rem;margin-top:4px">Like the Nutri-Score, worked out from the macros per serving. Salt and saturated fat are not tracked, so treat it as a rough guide.</span></div></div>` : '')(nutriScore(r))}
  </section>`;
}

function renderResults(){
  const el = $('#results'); if (!el) return;
  const {T, hits} = search(S.q, [...S.picked]);
  if (!T.length){ el.innerHTML = `<div class="callout">${ic('search')}<p>Type one or more ingredients, or tap them above. Recipes that use the most of what you have come first.</p></div>`; return; }
  const qtxt = T.join(', ');
  el.innerHTML = `<div class="sec-head"><h2>${hits.length ? `${hits.length} recipe${hits.length===1?'':'s'} found` : 'Nothing found'}</h2></div>
    ${hits.length ? `<div class="grid">${hits.map(h=>card(h.id,h.r, h.used.length?`<div class="match">${h.used.map(u=>`<span>${ic('check')} ${esc(u)}</span>`).join('')}</div>`:'')).join('')}</div>`
      : `<div class="empty">${ic('search')}<h3>No match for “${esc(qtxt)}”</h3><p>Try fewer or different ingredients.</p></div>`}`;

function ideaCard(r,k,src='ideas'){

  return `<article class="idea"><div class="cover" style="background:${catColor(c)}">${ic(c,'big')}${r.cuisine?`<span class="flagtag">${flag(r.cuisine)} ${esc(r.cuisine)}</span>`:''}<div class="badge">${r.time?`<span class="pill">${ic('clock')}${fmtTime(r.time)}</span>`:''}${r.nutrition?.protein?`<span class="pill">${ic('bolt')}${Math.round(r.nutrition.protein)} g</span>`:''}</div></div>

function vAdd(){

    </div>
    <div class="field"><label for="fIngs">Ingredients</label><textarea class="input" id="fIngs" rows="10" placeholder="500 g spaghetti&#10;2 cloves garlic, crushed&#10;For the sauce:&#10;400 g chopped tomatoes">${esc(r.ingredients.map(lineOf).join('\n'))}</textarea><span class="hint">One per line: amount, unit, ingredient. A line ending in “:” starts a group.</span></div>
    <div class="field"><label for="fSteps">Steps</label><textarea class="input" id="fSteps" rows="8" placeholder="One step per line">${esc(r.steps.join('\n'))}</textarea></div>
    <div class="field"><label for="fNotes">Flo's notes</label><textarea class="input" id="fNotes" style="min-height:80px" placeholder="Less salt next time. Great with garlic bread.">${esc(r.notes)}</textarea></div>
    <div class="row">
      <div class="field"><label for="fTags">Tags</label><input class="input" id="fTags" value="${esc(r.tags.join(', '))}" placeholder="quick, vegetarian, meal prep"></div>
      <div class="field"><label for="fSrcN">Source</label><input class="input" id="fSrcN" value="${esc(r.source?.name)}" placeholder="Mum, Chefkoch, Ottolenghi…"></div>
      <div class="field"><label for="fSrcU">Source link</label><input class="input" id="fSrcU" type="url" value="${esc(r.source?.url)}" placeholder="https://…"></div>
    </div>
    <div class="hero-actions"><button class="btn primary" type="submit">${ic('check')}Save recipe</button><button class="btn ghost" type="button" data-act="back">Cancel</button></div>
  </form>`;
}

/* ---------- render ---------- */
const DOCK = [['home','home','Home'],['search','search','Search'],['season','leaf','In season']];
function render(anim){
  const R = S.route, v = $('#view');
  let html;
  switch (R.name){
    case 'cat': html = vCat(R.id); break;
    case 'season': html = vSeason(R.id); break;
    case 'cuisine': html = vCuisine(R.id); break;
    case 'recipe': html = vRecipe(R.id); break;
    case 'search': html = vSearch(); break;
    default: html = vHome();
  }
  v.innerHTML = html;
  if (anim){ v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in'); }
  if (R.name==='search') renderResults();
  const active = R.name==='edit' ? 'add' : DOCK.some(d=>d[0]===R.name) ? R.name : '';
  $('#dock').innerHTML = DOCK.filter(d => d[0]!=='add' || S.canWrite!==false).map(([k,i,l])=>`<button class="${active===k?'on':''}" data-act="nav" data-to="${k}" ${active===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('');
  $('#backBtn').hidden = R.name==='home';
  const files = $('#impFiles'); if (files) files.onchange = e => pickFiles(e.target.files);
  if (R.name==='recipe'){ const r=S.recipes.get(R.id); document.title = r ? r.title + ' · Cook Bot 2000' : 'Cook Bot 2000'; } else document.title = 'Cook Bot 2000';
}
const LIVE = new Set(['home','cat','recipe','season','cuisine']);
function onData(){ if (LIVE.has(S.route.name)) render(false); else if (S.route.name==='search'){ renderResults(); } }

/* ---------- Claude ---------- */
const SCHEMA = `{"title": string, "description": "one appetising sentence", "categories": [one or more of "breakfast","soups","pasta","meat","fish","veggie","salads","bread","cakes","desserts"], "servings": number, "time": total minutes as a number, "difficulty": "easy"|"medium"|"hard", "tags": [up to 5 short lowercase strings], "ingredients": [{"qty": number or null, "unit": string ("g","ml","tsp","tbsp","pcs","cloves", or "" when it is just a count), "name": string, "note": string} or {"heading": "For the sauce"}], "steps": [one string per step], "cuisine": "the cooking tradition it comes from, one or two words, e.g. German, Italian, Indian, American, Mexican, Japanese, Middle Eastern, Asian Fusion", "seasons": [the seasons it suits best, from "spring","summer","autumn","winter"; all four for a year-round dish], "nutrition": {"kcal": number, "protein": grams, "carbs": grams, "fat": grams, "fiber": grams, "sugar": grams, all estimated per serving}}`;
const RULES = `Chapter rules: "breakfast" = breakfast and brunch. "soups" = soups, stews, broths, chili. "pasta" = pasta and noodle dishes. "meat" = the main ingredient is meat or poultry. "fish" = fish or seafood is the star. "veggie" = vegetarian or vegan mains (no meat or fish). "salads" = salads and bowls. "bread" = breads, sourdough, rolls, focaccia. "cakes" = sweet baking: cakes, cookies, buns, pastries. "desserts" = spoon desserts and puddings. Use every chapter that fits (a bolognese is ["pasta","meat"], a salmon poke bowl is ["salads","fish"]). High protein is detected automatically from the nutrition, so do not add it as a chapter. Quantities must be plain numbers (0.5, not "1/2") so the app can scale them; put words like "to taste" in note with qty null.`;
function sampleErr(e){
  const c = e?.code;
  if (c==='not_granted' || c==='denied') return 'Claude needs your OK to help here. Allow it when asked, then try again.';
  if (c==='rate_limited') return 'Claude is a bit busy. Give it a minute, then try again.';
  if (c==='invalid_json') return 'Claude answered in a way the cookbook could not read. Try again.';
  if (c==='cancelled') return '';
  return 'Claude could not answer just now. Try again in a moment.';
}
async function runIdeas(q, fresh){
  if (!sample || !q.trim()) return;
  const I = S.ideas; I.q = q; I.lastQ = q; I.busy = true; I.err = ''; I.list = []; I.saved = {}; render(false);
  const have = list().map(r=>r.title).slice(0,60).join('; ');
  try {
    const out = await sample.json(`You are the recipe scout inside Flo's personal digital cookbook. Flo writes: "${q}".
Suggest 3 distinct, reliable home-cooking recipes that fit this wish, each a complete recipe. Use metric units. Write in English.
${have ? 'Flo already has: ' + have + '. Do not repeat those.' : ''}
${RULES}
Reply with only JSON: {"ideas": [RECIPE, RECIPE, RECIPE]} where RECIPE is ${SCHEMA} plus "why": "one short friendly sentence on why it fits the wish".`, {cache: fresh ? false : true});
    const arr = Array.isArray(out) ? out : out?.ideas;
    if (!Array.isArray(arr) || !arr.length) throw {code:'invalid_json'};
    I.list = arr.slice(0,4).map(x => ({...norm(x, {noAutoProtein:false}), why: String(x.why||'')}));
  } catch(e){ I.err = sampleErr(e); }
  I.busy = false; if (S.route.name==='ideas') render(false);
}
async function runImport(images){
  const I = S.imp; if (!sample) return;
  if (!images && !I.text.trim()){
    I.err = I.url ? 'The cookbook can\'t open websites itself. Open the link, copy the recipe text and paste it into the box, and keep the link above as the source.' : 'Paste the recipe text first.';
    render(false); return;
  }
  I.busy = true; I.err = ''; render(false);
  try {
    const src = images ? 'The attached image(s) show a recipe: a cookbook page, a handwritten card or a screenshot. Read it carefully.' : 'Here is the recipe text Flo pasted' + (I.url ? ' (from ' + I.url + ')' : '') + ':\n"""\n' + I.text.slice(0, 60000) + '\n"""';
    const out = await sample.json(`You turn recipes into clean entries for Flo's digital cookbook.
${src}
Extract the recipe faithfully: keep the original amounts and servings, do not invent ingredients. Write it in English (translate if needed). Keep metric units; convert cups and ounces to grams or ml. Fill in time, difficulty and a per-serving nutrition estimate if the source has none. Put a book or website name in "source" if you can tell.
${RULES}
Reply with only JSON: ${SCHEMA.slice(0,-1)}, "source": {"name": string}}. If there is no recipe at all, reply {"error": "short reason"}.`, images ? {images, cache:false} : {});
    if (out?.error) throw {code:'none', msg: 'No recipe found: ' + out.error};
    const r = norm({...out, source:{name: out?.source?.name || '', url: I.url}});
    const cats = r.categories.map(c=>CAT[c].name).join(' and ');
    S.draft = {id:null, r}; S.draftNote = `Claude filed this under ${cats}. Check the details and save.`;
    I.busy = false; I.text = ''; I.files = []; go({name:'edit'});
  } catch(e){ I.busy = false; I.err = e?.msg || sampleErr(e); render(false); }
}
function pickFiles(fl){
  const max = S.imgMax || 4;
  S.imp.files.forEach(f=>URL.revokeObjectURL(f.url));
  S.imp.files = [...fl].slice(0,max).map(f=>({f, url:URL.createObjectURL(f)}));
  S.imp.err = ''; render(false);
}

/* ---------- fun ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(el){
  if (reduce || !el) return;
  const box = el.getBoundingClientRect(), x = box.left + box.width/2, y = box.top + Math.min(box.height/2, 120);
  const cols = ['--c-breakfast','--c-soups','--c-meat','--c-veggie','--c-cakes','--c-desserts','--c-fish','--tomato'];
  for (let i = 0; i < 26; i++){
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.background = `var(${cols[i % cols.length]})`;
    document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
    c.animate([{transform:'translate(-50%,-50%) rotate(0)', opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d + 120}px) rotate(${Math.random()*720-360}deg)`, opacity:0}], {duration:900 + Math.random()*500, easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish = () => c.remove();
  }
}
async function estimate(id){
  const r = S.recipes.get(id); if (!r || !sample) return;
  S.estimating = true; render(false);
  try {
    const out = await sample.json(`Estimate the nutrition per serving for this recipe, which serves ${r.servings}. Ingredients:\n${r.ingredients.filter(i=>!i.heading).map(lineOf).join('\n')}\nReply with only JSON: {"kcal": number, "protein": grams, "carbs": grams, "fat": grams, "fiber": grams, "sugar": grams}.`, {modelTier:'quick'});
    const num = v => { const x = parseFloat(v); return isNaN(x) ? null : Math.round(x); };
    const n = {kcal:num(out.kcal), protein:num(out.protein), carbs:num(out.carbs), fat:num(out.fat), fiber:num(out.fiber), sugar:num(out.sugar)};
    const cats = (n.protein||0) >= 30 && !r.categories.includes('protein') ? [...r.categories, 'protein'] : r.categories;
    await patch(id, {nutrition:n, categories:cats}); toast('Nutrition added','bolt');
  } catch(e){ if (e && e.code && !['invalid_argument','quota_exceeded'].includes(e.code)) toast(sampleErr(e) || 'Could not estimate right now','out'); else writeErr(e); }
  S.estimating = false; render(false);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a==='fav') e.stopPropagation();
  switch (a){
    case 'home': go({name:'home'}); break;
    case 'back': back(); break;
    case 'nav': go({name:b.dataset.to}); break;
    case 'cat': go({name:'cat', id}); break;
    case 'season': go({name:'season', id: nowSeason()}); break;
    case 'seasonset': if (S.route.name==='season'){ S.route = {name:'season', id}; try { history.replaceState({route:S.route, depth:S.depth}, '', toHash(S.route)); } catch {} render(false); } else go({name:'season', id}); break;
    case 'cuisine': if (S.route.name==='cuisine'){ S.route = {name:'cuisine', id}; try { history.replaceState({route:S.route, depth:S.depth}, '', toHash(S.route)); } catch {} render(false); } else go({name:'cuisine', id}); break;
    case 'buddy': {
      tipAt = (tipAt + 1) % TIPS.length; const bb = $('#bubble'); if (bb) bb.textContent = TIPS[tipAt];
      const m = b.querySelector('.mascot'); m.classList.remove('jump'); void m.getBoundingClientRect(); m.classList.add('jump');
      if (tipAt % 4 === 0) burst(b); break;
    }
    case 'nbatch': S.nutriBatch = b.dataset.v === '1'; render(false); break;
    case 'estimate': estimate(id); break;
    case 'fsea': { const r=S.draft.r, x=b.dataset.id; r.seasons = r.seasons.includes(x) ? r.seasons.filter(y=>y!==x) : [...r.seasons, x]; b.classList.toggle('on'); b.setAttribute('aria-pressed', r.seasons.includes(x)); break; }
    case 'open': go({name:'recipe', id}); break;
    case 'sort': S.sort = b.dataset.k; render(false); break;
    case 'ctag': S.catTag[b.dataset.cat] = b.dataset.t; render(false); break;
    case 'surprise': {
      const d = $('#diceBtn'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      const ids = [...S.recipes.keys()].filter(k => k !== S.route.id);
      if (!ids.length){ toast('Add a recipe first, then I can surprise you', 'dice'); break; }
      setTimeout(()=>go({name:'recipe', id: ids[Math.floor(Math.random()*ids.length)]}), 280); break;
    }
    case 'qsearch': S.q = b.dataset.q; S.picked.clear(); go({name:'search'}); break;
    case 'pick': { const x=b.dataset.x; S.picked.has(x)?S.picked.delete(x):S.picked.add(x); b.classList.toggle('on'); renderResults(); break; }
    case 'ideasfor': go({name:'ideas'}); runIdeas(b.dataset.q); break;
    case 'moreideas': runIdeas(S.ideas.lastQ, true); break;
    case 'rewild': loadWild(true); break;
    case 'theme': { themePick = id; try { localStorage.setItem('cookbot.theme', id); } catch {} applyTheme(); render(false); toast(id==='auto' ? 'The look now follows the season' : SEA[id].emoji + ' ' + SEA[id].name + ' look on', 'spark'); break; }
    case 'saveidea': {
      if (S.canWrite===false) break;
      const k = +b.dataset.k, W = b.dataset.src==='wild', r = (W ? S.wild.list : S.ideas.list)[k]; if (!r) break;
      const {why, trend, ...rec} = r; const nid = slug(r.title);
      b.disabled = true;
      try { await put(nid, {...rec, source:{name: W ? 'Dish of the day' : 'Claude suggestion', url:''}, createdAt:new Date().toISOString()}); (W ? S.wild.saved : S.ideas.saved)[k] = nid; toast('Saved to ' + CAT[rec.categories[0]].name); burst(b); render(false); }
      catch(err){ b.disabled=false; writeErr(err); }
      break;
    }
    case 'fav': {
      const r = S.recipes.get(id); if (!r) break;
      try { await patch(id, {favorite: !r.favorite}); render(false); const h = document.querySelector(`.heart[data-id="${CSS.escape(id)}"]`); h?.classList.add('pop'); if (!r.favorite){ toast('Added to favourites','heart'); burst(b); } }
      catch(err){ writeErr(err); }
      break;
    }
    case 'tick': {
      const k = +b.dataset.k, set = S.checked[id] || (S.checked[id] = new Set());
      set.has(k) ? set.delete(k) : set.add(k); render(false); break;
    }
    case 'step': { const k=+b.dataset.k; S.stepAt[id] = (S.stepAt[id]??0) === k ? k+1 : k; render(false); if (S.stepAt[id] >= (S.recipes.get(id)?.steps||[]).length) burst(document.querySelector('.callout.good') || document.body); break; }
    case 'resetsteps': S.stepAt[id] = 0; render(false); break;
    case 'sv': case 'svset': {
      const r = S.recipes.get(id); const cur = S.servings[id] || r.servings || 4;
      S.servings[id] = a==='sv' ? Math.min(99, Math.max(1, cur + (+b.dataset.d))) : +b.dataset.v;
      render(false); const o = $('#svOut'); o?.classList.add('bump');
      document.querySelectorAll('.ing').forEach(x=>x.classList.add('flash'));
      break;
    }
    case 'copylist': {
      const r = S.recipes.get(id), f = (S.servings[id]||r.servings)/r.servings;
      const txt = r.title + ' (serves ' + (S.servings[id]||r.servings) + ')\n' + r.ingredients.map(i => i.heading ? '\n' + i.heading + ':' : '• ' + [fmtQty(i.qty==null?null:i.qty*f, i.unit).q, fmtQty(i.qty==null?null:i.qty*f, i.unit).unit, i.name].filter(Boolean).join(' ')).join('\n');
      try { await navigator.clipboard.writeText(txt); toast('Shopping list copied','copy'); } catch { toast('Copying is blocked here. Select the ingredients to copy them.','copy'); }
      break;
    }
    case 'wake': {
      if (S.wake){ try { await S.wake.release(); } catch {} S.wake = null; render(false); break; }
      try { S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', ()=>{ S.wake=null; if (S.route.name==='recipe') render(false); }); toast('Screen stays on while you cook','sun'); }
      catch { toast('This device won\'t keep the screen on from here','sun'); }
      render(false); break;
    }
    case 'share': {
      const r = S.recipes.get(id), url = location.href.split('#')[0] + '#r/' + encodeURIComponent(id);
      if (navigator.share){ try { await navigator.share({title: r?.title || 'Cook Bot', url}); } catch {} break; }
      try { await navigator.clipboard.writeText(url); toast('Link copied','link'); } catch { prompt('Copy this link', url); }
      break;
    }
    case 'askdel': S.confirmDel = id; render(false); break;
    case 'nodel': S.confirmDel = null; render(false); break;
    case 'del': {
      const t = S.recipes.get(id)?.title;
      try { await remove(id); S.confirmDel=null; toast('Deleted “' + t + '”','trash'); go({name:'home'}); } catch(err){ writeErr(err); }
      break;
    }
    case 'edit': { const r = S.recipes.get(id); S.draft = {id, r: JSON.parse(JSON.stringify(r))}; S.draftNote=''; go({name:'edit'}); break; }
    case 'manual': S.draft = {id:null, r: norm({title:'', categories:[]})}; S.draft.r.title=''; S.draft.r.categories=[]; S.draft.r.seasons=[]; S.draftNote=''; go({name:'edit'}); break;
    case 'fcat': { const r=S.draft.r, c=b.dataset.id; r.categories = r.categories.includes(c) ? r.categories.filter(x=>x!==c) : [...r.categories, c]; b.classList.toggle('on'); b.setAttribute('aria-pressed', r.categories.includes(c)); break; }
    case 'imptab': S.imp.tab = b.dataset.k; S.imp.err=''; render(false); break;
    case 'readphoto': runImport(S.imp.files.map(f=>f.f)); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('.rcard')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id==='searchQ'){ S.q = t.value; renderResults(); }
  else if (t.id==='ideasQ') S.ideas.q = t.value;
  else if (t.id==='impUrl') S.imp.url = t.value;
  else if (t.id==='impText') S.imp.text = t.value;
});
document.addEventListener('submit', async e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f==='homesearch'){ S.q = $('#homeQ').value; S.picked.clear(); go({name:'search'}); }
  else if (f==='search'){ $('#searchQ').blur(); }
  else if (f==='ideas'){ runIdeas($('#ideasQ').value); }
  else if (f==='import'){ runImport(null); }
  else if (f==='edit'){
    const d = S.draft, v = id => $('#'+id).value;
    if (!d.r.categories.length){ toast('Pick at least one chapter','book'); return; }
    const raw = {
      ...d.r, title: v('fTitle'), description: v('fDesc'), servings: v('fServ'), time: v('fTime'), difficulty: v('fDiff'),
      nutrition: {kcal: v('fKcal'), protein: v('fProt'), carbs: v('fCarb'), fat: v('fFat'), fiber: v('fFib'), sugar: v('fSug')}, cuisine: v('fCuis'),
      ingredients: v('fIngs').split('\n').map(parseLine).filter(Boolean),
      steps: v('fSteps').split('\n'), notes: v('fNotes'),
      tags: v('fTags').split(',').map(s=>s.trim()).filter(Boolean),
      source: {name: v('fSrcN'), url: v('fSrcU')},
    };
    const r = norm(raw, {createdAt: d.r.createdAt, noAutoProtein: true});
    r.categories = d.r.categories.filter(c=>CAT[c]);
    r.seasons = d.r.seasons.length ? d.r.seasons.filter(x=>SEA[x]) : SEASONS.map(x=>x.id);
    const nid = d.id || slug(r.title);
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    try {
      await put(nid, r); delete S.servings[nid];
      toast(d.id ? 'Saved your changes' : 'Added to ' + CAT[r.categories[0]].name); if (!d.id) setTimeout(()=>burst(document.querySelector('.band')||document.body), 150);
      S.draft = null;
      S.route = {name:'recipe', id:nid};
      try { history.replaceState({route:S.route, depth:S.depth}, ''); } catch {}
      render(true); window.scrollTo(0,0);
    } catch(err){ btn.disabled = false; writeErr(err); }
  }
});
window.addEventListener('dragover', e => { if (S.route.name==='add' && S.imp.tab==='photo') e.preventDefault(); });
window.addEventListener('drop', e => { if (S.route.name==='add' && S.imp.tab==='photo' && e.dataTransfer?.files?.length){ e.preventDefault(); pickFiles(e.dataTransfer.files); } });
document.addEventListener('visibilitychange', async () => { if (S.wake && document.visibilityState==='visible'){ try { S.wake = await navigator.wakeLock.request('screen'); } catch {} } });

/* ---------- boot ---------- */
applyTheme();
$('#backBtn').innerHTML = ic('back'); $('#diceBtn').innerHTML = ic('dice'); $('#brandIc').innerHTML = mascot(); $('#leafBtn').innerHTML = '<span style="font-size:1.25rem">' + SEA[nowSeason()].emoji + '</span>';
render(false);

S.recipes = new Map(Object.entries(window.COOKBOOK_RECIPES || {}));
S.canWrite = false; S.mode = 'static'; S.ready = true;
render(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
